openapi: 3.1.0
info:
  title: Smart Learning Platform Business Backend API
  version: 1.0.0
  description: >-
    工程团队交付的网站业务层 HTTP API 完整契约规范（v1.0）。
    覆盖公共认证与通知中心、学生学习域、教师教学与人工校准域、管理端六大治理域、Prometheus 监控探针，以及接收 AI 助教服务异步任务回调的内部签名 Webhook 接口。
servers:
  - url: http://localhost:8000
    description: Platform Business Backend
security:
  - BearerAuth: []
tags:
  - name: Probe
    description: 数据库探活与 Prometheus 监控指标暴露
  - name: MediaStreaming
    description: 支持 HTTP 206 Partial Content Range 字节流拖拽播放的媒体分发
  - name: Auth
    description: 登录令牌签发、注册、刷新令牌、密码安全、当前身份与站内通知
  - name: Courses
    description: 课程分类、课程广场、班级选课、已发布章节与文字稿、精选 FAQ 与个人工单
  - name: StudentLearning
    description: 学习行为上报、时间戳笔记与书签、边看边问 AI 助教、章节自测/考试/个性化测验/错题重练、错题本、个人仪表盘与推荐
  - name: TeacherStudio
    description: 课程与封面管理、班级学生名册与 Excel 导入分组、大文件分片断点续传、AI 提纲校准与单章重生成、题库手动/AI 出题审题组卷、未解答收件箱回流、FAQ 与学情看板
  - name: AdminGovernance
    description: 管理端六大域（组织账号与权限矩阵、课程审核分类与合规下架、AI 任务与索引监控、按比例随机抽检与样本闭环、多维 CSV/XLSX 报表、公告工单审计与系统全景状态）
  - name: InternalWebhooks
    description: AI 服务异步任务完成回调接收端点（HMAC-SHA256 验签 + Idempotency-Key 幂等）

components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  schemas:
    ResponseMeta:
      type: object
      required: [request_id, timestamp]
      properties:
        request_id: { type: string }
        timestamp: { type: string, format: date-time }
        pagination:
          type: object
          properties:
            page: { type: integer }
            page_size: { type: integer }
            total: { type: integer }
            total_pages: { type: integer }

    SuccessEnvelope:
      type: object
      required: [data, meta]
      properties:
        data: { type: object }
        meta: { $ref: "#/components/schemas/ResponseMeta" }

    ErrorEnvelope:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message, request_id]
          properties:
            code: { type: string, example: STORAGE_QUOTA_EXCEEDED }
            message: { type: string }
            details:
              type: array
              items: { type: object }
            request_id: { type: string }

    LoginRequest:
      type: object
      required: [username, password]
      properties:
        username: { type: string }
        password: { type: string }

    RegisterRequest:
      type: object
      required: [username, display_name, password]
      properties:
        username: { type: string, minLength: 3, maxLength: 64 }
        display_name: { type: string }
        email: { type: string }
        password: { type: string, minLength: 8 }
        role: { type: string, enum: [student, teacher], default: student }

    RefreshTokenRequest:
      type: object
      required: [refresh_token]
      properties:
        refresh_token: { type: string }

    PasswordChangeRequest:
      type: object
      required: [current_password, new_password]
      properties:
        current_password: { type: string }
        new_password: { type: string, minLength: 8 }

    NotificationPatchRequest:
      type: object
      properties:
        is_read: { type: boolean, default: true }

    SupportTicketCreateRequest:
      type: object
      required: [subject]
      properties:
        category: { type: string, default: 课程与平台反馈 }
        subject: { type: string }
        description: { type: string }

    LearningEventRequest:
      type: object
      required: [course_id]
      properties:
        course_id: { type: string }
        video_id: { type: [string, "null"] }
        event_type: { type: string, enum: [watch_progress, replay_segment, skip_segment], default: watch_progress }
        position_sec: { type: integer, minimum: 0, default: 0 }
        watched_seconds: { type: integer, minimum: 0, maximum: 3600, default: 30 }
        completed: { type: boolean, default: false }

    NoteCreateRequest:
      type: object
      required: [course_id, video_id, content]
      properties:
        course_id: { type: string }
        video_id: { type: string }
        timestamp_sec: { type: integer, minimum: 0, default: 0 }
        content: { type: string }
        is_bookmark: { type: boolean, default: false }

    NotePatchRequest:
      type: object
      properties:
        content: { type: [string, "null"] }
        is_bookmark: { type: [boolean, "null"] }
        timestamp_sec: { type: [integer, "null"] }

    TutorAskRequest:
      type: object
      required: [question]
      properties:
        question: { type: string, minLength: 1, maxLength: 2000 }
        quick_action:
          type: [string, "null"]
          enum: [explain_simply, give_example, summarize_key_points, null]
        video_context: { type: [object, "null"] }

    MessageFeedbackRequest:
      type: object
      properties:
        vote: { type: [string, "null"], enum: [up, down, reported, null] }
        bookmarked: { type: [boolean, "null"] }
        reason: { type: string }

    QuizSessionStartRequest:
      type: object
      properties:
        session_type:
          type: string
          enum: [chapter_practice, personalized, exam, wrong_retry]
          default: chapter_practice
        chapter_id: { type: [string, "null"] }
        exam_id: { type: [string, "null"] }
        wrong_record_ids:
          type: array
          items: { type: string }
        count: { type: integer, minimum: 1, maximum: 25, default: 3 }

    QuizSubmissionRequest:
      type: object
      properties:
        answers:
          type: object
          additionalProperties:
            type: array
            items: { type: string }

    WrongQuestionPatchRequest:
      type: object
      properties:
        is_mastered: { type: [boolean, "null"] }
        review_note: { type: [string, "null"] }

    CourseCreateRequest:
      type: object
      required: [title]
      properties:
        code: { type: string }
        title: { type: string }
        subtitle: { type: string }
        category: { type: string, default: 人工智能 }
        cover_url: { type: string }
        description: { type: string }
        start_date: { type: string }
        end_date: { type: string }
        submit_for_review: { type: boolean, default: true }

    CoursePatchRequest:
      type: object
      properties:
        code: { type: [string, "null"] }
        title: { type: [string, "null"] }
        subtitle: { type: [string, "null"] }
        category: { type: [string, "null"] }
        cover_url: { type: [string, "null"] }
        cover_color: { type: [string, "null"] }
        description: { type: [string, "null"] }
        start_date: { type: [string, "null"] }
        end_date: { type: [string, "null"] }
        status: { type: [string, "null"], enum: [draft, pending_review, closed, archived, null] }

    ClassCreateRequest:
      type: object
      required: [name]
      properties:
        name: { type: string }
        term: { type: string, default: 2026秋季学期 }

    StudentRosterImportRequest:
      type: object
      properties:
        class_id: { type: [string, "null"] }
        group_name: { type: string }
        usernames_or_csv:
          oneOf:
            - type: string
            - type: array
              items: { type: string }

    EnrollmentPatchRequest:
      type: object
      properties:
        class_id: { type: [string, "null"] }
        group_name: { type: [string, "null"] }

    VideoUploadRequest:
      type: object
      required: [title]
      properties:
        title: { type: string }
        media_url: { type: string }
        duration_sec: { type: integer, default: 480 }
        raw_transcript_text: { type: string }
        knowledge_points: { type: array, items: { type: string } }
        run_inline: { type: boolean, default: false }

    ChunkUploadInitRequest:
      type: object
      required: [filename, total_size, total_chunks]
      properties:
        filename: { type: string }
        title: { type: string }
        total_size: { type: integer, minimum: 1 }
        total_chunks: { type: integer, minimum: 1 }

    ChunkUploadCompleteRequest:
      type: object
      properties:
        title: { type: string }
        knowledge_points: { type: array, items: { type: string } }
        run_inline: { type: boolean, default: false }

    ChapterRegenerateRequest:
      type: object
      properties:
        start_sec: { type: integer, minimum: 0 }
        end_sec: { type: integer, minimum: 1 }
        current_title: { type: string }
        instruction: { type: string }

    CalibratedOutlineRequest:
      type: object
      required: [chapters]
      properties:
        chapters: { type: array, items: { type: object } }
        change_note: { type: string }

    DocumentUploadRequest:
      type: object
      required: [title, content_text]
      properties:
        title: { type: string }
        file_format: { type: string, default: markdown }
        content_text: { type: string }

    QuestionManualCreateRequest:
      type: object
      required: [stem, answer]
      properties:
        chapter_id: { type: [string, "null"] }
        question_type: { type: string, default: single_choice }
        stem: { type: string }
        options:
          type: array
          items: { type: object }
        answer:
          type: array
          items: { type: string }
        explanation: { type: string }
        difficulty: { type: string, default: medium }
        knowledge_point: { type: string, default: 核心概念 }

    QuestionBatchGenRequest:
      type: object
      properties:
        chapter_ids: { type: array, items: { type: string } }
        knowledge_points: { type: array, items: { type: string } }
        question_types: { type: array, items: { type: string } }
        difficulty: { type: string, enum: [easy, medium, hard, mixed], default: mixed }
        count: { type: integer, minimum: 1, maximum: 15, default: 3 }

    QuestionReviewPatchRequest:
      type: object
      properties:
        stem: { type: [string, "null"] }
        options: { type: [array, "null"], items: { type: object } }
        answer: { type: [array, "null"], items: { type: string } }
        explanation: { type: [string, "null"] }
        difficulty: { type: [string, "null"] }
        knowledge_point: { type: [string, "null"] }
        question_type: { type: [string, "null"] }
        chapter_id: { type: [string, "null"] }
        review_status: { type: [string, "null"], enum: [pending_review, approved, rejected, null] }

    ExamCreateRequest:
      type: object
      required: [title, question_ids]
      properties:
        title: { type: string }
        question_ids: { type: array, items: { type: string } }
        time_limit_min: { type: integer, default: 30 }
        max_attempts: { type: integer, default: 3 }
        target_class_id: { type: [string, "null"] }
        start_time: { type: [string, "null"] }
        end_time: { type: [string, "null"] }

    InboxResolveRequest:
      type: object
      required: [teacher_answer]
      properties:
        teacher_answer: { type: string }
        sync_to_kb: { type: boolean, default: true }
        pin_as_faq: { type: boolean, default: false }

    TutorConfigRequest:
      type: object
      properties:
        strict_course_only: { type: boolean, default: true }
        allow_out_of_syllabus: { type: boolean, default: false }
        tone: { type: string, default: encouraging_academic }
        forbidden_topics: { type: array, items: { type: string } }

    FaqCreateRequest:
      type: object
      required: [question, answer]
      properties:
        question: { type: string }
        answer: { type: string }
        is_pinned: { type: boolean, default: true }

    FaqPatchRequest:
      type: object
      properties:
        question: { type: [string, "null"] }
        answer: { type: [string, "null"] }
        is_pinned: { type: [boolean, "null"] }

    TeacherQualityFeedbackRequest:
      type: object
      required: [input_text]
      properties:
        sample_type: { type: string, enum: [outline, question, tutor_reply], default: outline }
        input_text: { type: string }
        model_output: { type: string }
        reason: { type: string }

    OrgCreateRequest:
      type: object
      required: [name]
      properties:
        name: { type: string }
        org_type: { type: string, enum: [department, grade, class], default: class }
        parent_id: { type: [string, "null"] }

    OrgPatchRequest:
      type: object
      properties:
        name: { type: [string, "null"] }
        org_type: { type: [string, "null"], enum: [department, grade, class, null] }
        parent_id: { type: [string, "null"] }

    UserCreateRequest:
      type: object
      required: [username, display_name, password]
      properties:
        username: { type: string }
        display_name: { type: string }
        email: { type: string }
        password: { type: string, minLength: 8 }
        role: { type: string, enum: [student, teacher, admin], default: student }
        org_id: { type: [string, "null"] }

    BatchUserImportRequest:
      type: object
      required: [csv_text]
      properties:
        csv_text: { type: string }
        org_id: { type: [string, "null"] }

    UserPatchRequest:
      type: object
      properties:
        display_name: { type: [string, "null"] }
        email: { type: [string, "null"] }
        org_id: { type: [string, "null"] }
        role: { type: [string, "null"], enum: [student, teacher, admin, null] }
        is_active: { type: [boolean, "null"] }
        teacher_approved: { type: [boolean, "null"] }
        teacher_status: { type: [string, "null"], enum: [pending, approved, rejected, null] }
        reject_reason: { type: [string, "null"] }
        reset_password: { type: [string, "null"] }

    PermissionsMatrixPutRequest:
      type: object
      properties:
        roles: { type: [object, "null"] }
        items: { type: [array, "null"], items: { type: object } }

    BatchClassAssignRequest:
      type: object
      required: [course_id, class_id]
      properties:
        course_id: { type: string }
        class_id: { type: string }
        student_ids: { type: array, items: { type: string } }
        source_org_id: { type: [string, "null"] }
        group_name: { type: string }

    CategoryCreateRequest:
      type: object
      required: [name]
      properties:
        name: { type: string }
        slug: { type: string }
        sort_order: { type: integer, default: 0 }
        is_visible: { type: boolean, default: true }

    CategoryPatchRequest:
      type: object
      properties:
        name: { type: [string, "null"] }
        slug: { type: [string, "null"] }
        sort_order: { type: [integer, "null"] }
        is_visible: { type: [boolean, "null"] }

    CourseGovernancePatchRequest:
      type: object
      properties:
        status:
          type: [string, "null"]
          enum: [published, pending_review, rejected, archived, takedown, null]
        reject_reason: { type: [string, "null"] }
        is_featured: { type: [boolean, "null"] }
        storage_quota_mb: { type: [integer, "null"] }
        expires_at: { type: [string, "null"] }

    TakedownRequest:
      type: object
      properties:
        reason: { type: string, default: 敏感或版权合规处置下架 }

    AdminRetryRequest:
      type: object
      properties:
        run_inline: { type: boolean, default: true }

    SpotCheckDrawRequest:
      type: object
      properties:
        sample_type: { type: string, enum: [all, tutor_reply, outline, question], default: all }
        sample_ratio_pct: { type: number, minimum: 1, maximum: 100, default: 20.0 }
        max_count: { type: integer, minimum: 1, maximum: 100, default: 10 }
        course_id: { type: [string, "null"] }

    SpotCheckCreateRequest:
      type: object
      required: [course_id, input_text]
      properties:
        course_id: { type: string }
        sample_type: { type: string, enum: [tutor_reply, outline, question], default: tutor_reply }
        message_id: { type: [string, "null"] }
        input_text: { type: string }
        model_output: { type: string }
        admin_note: { type: string }

    SampleResolutionRequest:
      type: object
      required: [status]
      properties:
        status: { type: string, enum: [corrected, blocked, synced_eval] }
        admin_note: { type: string }
        corrected_output: { type: string }

    AdminRuntimePatchRequest:
      type: object
      properties:
        confidence_threshold: { type: [number, "null"] }
        feature_flags: { type: [object, "null"] }
        safety_filter: { type: [object, "null"] }
        rate_limit_per_minute: { type: [object, "null"] }
        active_provider: { type: [string, "null"] }

    AnnouncementCreateRequest:
      type: object
      required: [title, content]
      properties:
        title: { type: string }
        content: { type: string }
        target_role: { type: string, enum: [all, student, teacher], default: all }

    TicketPatchRequest:
      type: object
      properties:
        status: { type: [string, "null"], enum: [open, in_progress, resolved, null] }
        assignee_id: { type: [string, "null"] }
        assignee_name: { type: [string, "null"] }
        assignee_note: { type: [string, "null"] }

paths:
  /healthz:
    get:
      tags: [Probe]
      security: []
      summary: 服务存活与真实数据库连接探针 (SELECT 1)
      responses:
        "200": { description: 服务与数据库连通正常 }
        "503": { description: 数据库探活失败 }

  /metrics:
    get:
      tags: [Probe]
      security: []
      summary: 输出 Prometheus 标准文本监控指标
      responses:
        "200":
          description: Prometheus 文本格式指标
          content:
            text/plain:
              schema: { type: string }

  /media/{category}/{filename}:
    get:
      tags: [MediaStreaming]
      security: []
      summary: 媒体对象流式读取接口（支持 HTTP 206 Partial Content Range 字节流跳转与防目录穿越保护）
      parameters:
        - name: category
          in: path
          required: true
          schema: { type: string, enum: [videos, documents, covers, subtitles] }
        - name: filename
          in: path
          required: true
          schema: { type: string }
      responses:
        "200": { description: 完整媒体字节流 }
        "206": { description: 指定字节范围媒体分片流 }
        "404": { description: 媒体资源不存在 }

  /api/v1/auth/tokens:
    post:
      tags: [Auth]
      security: []
      summary: 用户名密码登录并签发 JWT 访问令牌与刷新令牌（滑动窗口防爆破限流）
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/LoginRequest" }
      responses:
        "200": { description: 返回 access_token、refresh_token 与用户角色档案 }

  /api/v1/auth/registrations:
    post:
      tags: [Auth]
      security: []
      summary: 商业门户自助注册账号（学生即开即用；教师注册后默认进入 pending 待审状态）
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RegisterRequest" }
      responses:
        "201": { description: 注册成功并签发双令牌 }

  /api/v1/auth/refresh:
    post:
      tags: [Auth]
      security: []
      summary: 使用有效 refresh_token 轮换续期新的 access_token 与 refresh_token
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RefreshTokenRequest" }
      responses:
        "200": { description: 返回轮换后的新双令牌 }

  /api/v1/users/me:
    get:
      tags: [Auth]
      summary: 获取当前登录用户档案、连续打卡天数与教师审核状态
      responses:
        "200": { description: 当前用户详情 }

  /api/v1/users/me/password:
    put:
      tags: [Auth]
      summary: 校验原密码并修改当前登录账号密码（强口令校验）
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PasswordChangeRequest" }
      responses:
        "200": { description: 密码已更新 }

  /api/v1/users/me/notifications:
    get:
      tags: [Auth]
      summary: 获取当前用户站内消息通知与未读计数
      responses:
        "200": { description: 通知列表与 unread_count }

  /api/v1/users/me/notifications/{notif_id}:
    patch:
      tags: [Auth]
      summary: 标记指定站内通知（或 notif_id=all 全部）为已读
      parameters:
        - name: notif_id
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: false
        content:
          application/json:
            schema: { $ref: "#/components/schemas/NotificationPatchRequest" }
      responses:
        "200": { description: 通知已读状态已更新 }

  /api/v1/users/me/support-tickets:
    get:
      tags: [Courses]
      summary: 查询当前登录师生本人提交的反馈工单、指派处理人与回复进展
      responses:
        "200": { description: 个人工单列表 }

  /api/v1/categories:
    get:
      tags: [Courses]
      security: []
      summary: 查询平台可见课程学科分类列表
      responses:
        "200": { description: 可见分类列表 }

  /api/v1/announcements:
    get:
      tags: [Courses]
      summary: 获取面向当前角色生效的全站系统公告
      responses:
        "200": { description: 生效公告列表 }

  /api/v1/courses:
    get:
      tags: [Courses]
      summary: 查询已上架课程广场列表（支持分类、关键字、精品筛选与分页）
      parameters:
        - name: category
          in: query
          schema: { type: string }
        - name: keyword
          in: query
          schema: { type: string }
        - name: featured_only
          in: query
          schema: { type: boolean, default: false }
        - name: page
          in: query
          schema: { type: integer, default: 1 }
        - name: page_size
          in: query
          schema: { type: integer, default: 20 }
      responses:
        "200": { description: 课程分页列表 }

  /api/v1/courses/{course_id}:
    get:
      tags: [Courses]
      summary: 获取课程详情、可见视频列表、未下架讲义摘要、精选 FAQ、试卷约束与已用作答次数
      parameters:
        - name: course_id
          in: path
          required: true
          schema: { type: string }
      responses:
        "200": { description: 课程聚合详情 }

  /api/v1/courses/{course_id}/enrollments:
    post:
      tags: [Courses]
      summary: 学生选修加入课程班级
      parameters:
        - name: course_id
          in: path
          required: true
          schema: { type: string }
      responses:
        "201": { description: 选课成功 }

  /api/v1/support-tickets:
    post:
      tags: [Courses]
