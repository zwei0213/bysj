      summary: 接收 AI 服务异步任务完成回调（HMAC-SHA256 验签 + 时间戳防重放 + Idempotency-Key 幂等去重）
      parameters:
        - name: X-Webhook-Timestamp
          in: header
          required: true
          schema: { type: string }
        - name: X-Webhook-Signature
          in: header
          required: true
          schema: { type: string }
        - name: Idempotency-Key
          in: header
          required: false
          schema: { type: string }
      responses:
        "200": { description: 回调已幂等处理 }
        "401": { description: 签名无效或超出防重放窗口 }
