global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/alert_rules.yml

scrape_configs:
  - job_name: "platform-backend"
    metrics_path: /metrics
    static_configs:
      - targets: ["platform-backend:8000"]

  - job_name: "ai-tutor-service"
    metrics_path: /metrics
    static_configs:
      - targets: ["ai-tutor-service:8001"]
